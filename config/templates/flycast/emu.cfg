[config]
Dreamcast.ContentPath = {ROOT}\roms
ForceFreePlay = yes
Dreamcast.Region = 1
Dreamcast.Language = 1
rend.Resolution = 2160
rend.WideScreen = no
rend.WidescreenGameHacks = no
rend.CrossHairColor1 = 0
rend.CrossHairColor2 = 0
rend.CrossHairColor3 = 0
rend.CrossHairColor4 = 0
rend.vsync = yes
rend.ShowFPS = no
rend.AnisotropicFiltering = 16
rend.IntegerScale = no
rend.LinearInterpolation = yes

[log]
; flycast.log for the launcher's session recordings (input devices found, port assignments).
LogToFile = yes
Verbosity = 4
INPUT = yes

[window]
fullscreen = yes
maximized = no

[input]
RawInput = yes
; Keys are Flycast's own device ids (device path without "\\?\HID#"); with the full path they never match
; and Flycast picks the ports itself (a desk mouse can take a player's port).
maple_raw_mouse_{P1MOUSE_ID} = 0
maple_raw_mouse_{P2MOUSE_ID} = 1
maple_raw_keyboard_{P1KBD_ID} = 0
maple_raw_keyboard_{P2KBD_ID} = 1
; Only with a Flycast build that routes software keys to a "Software Keyboard" device (official Flycast drops
; keys that have no device): 4 = all ports, per-port bindings in mappings\RAW_Software Keyboard_arcade.cfg
; ("1" = P1 Start, "2" = P2 Start). Pair with games.json "copyKeys" when a gun's own key isn't picked up.
maple_raw_keyboard_software = 4
; Every other mouse and keyboard off (-1).
{FLYCAST_OTHER_DEVICES}
