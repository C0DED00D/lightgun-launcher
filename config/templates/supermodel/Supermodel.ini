; Supermodel config written by the launcher at every launch.
; {P1MOUSE} / {P2MOUSE} are replaced with the raw-input mouse number of each gun, counted the way Supermodel does
; (it numbers mice in reverse order of Windows' device list).
; The window is 1 px shorter than the screen ({SCREEN_H_1}) so the launcher's border and quit banner stay visible.
[ Global ]
EmulateNet = 0
port_in = 1970
port_out = 1971
addr_out = "127.0.0.1"
XResolution = {SCREEN_W}
YResolution = {SCREEN_H_1}
FullScreen = 0
BorderlessWindow = 1
; Widescreen: 3D fills 16:9; guns still map to the original 4:3 area (pointing at the extra sides pins to its edge).
; WideBackground stretches the flat 2D backgrounds (sky, menus) so they don't leave black side bars.
WideScreen = 1
WideBackground = 1
Stretch = 0
VSync = 1
Throttle = 1
ShowFrameRate = 0
Crosshairs = 0
InputSystem = "rawinput"
New3DEngine = 1
QuadRendering = 1
Supersampling = 1
UpscaleMode = 2

InputStart1 = "KEY_1"
InputStart2 = "KEY_2"
InputCoin1 = "KEY_5"
InputCoin2 = "KEY_6"
InputServiceA = "KEY_9"
InputTestA = "KEY_0"
InputUIExit = "KEY_ESCAPE"

; Analog gun games
InputAnalogGunX = "MOUSE{P1MOUSE}_XAXIS"
InputAnalogGunY = "MOUSE{P1MOUSE}_YAXIS"
InputAnalogTriggerLeft = "MOUSE{P1MOUSE}_LEFT_BUTTON"
InputAnalogTriggerRight = "MOUSE{P1MOUSE}_RIGHT_BUTTON"
InputAnalogGunX2 = "MOUSE{P2MOUSE}_XAXIS"
InputAnalogGunY2 = "MOUSE{P2MOUSE}_YAXIS"
InputAnalogTriggerLeft2 = "MOUSE{P2MOUSE}_LEFT_BUTTON"
InputAnalogTriggerRight2 = "MOUSE{P2MOUSE}_RIGHT_BUTTON"

; Digital gun games
InputGunX = "MOUSE{P1MOUSE}_XAXIS"
InputGunY = "MOUSE{P1MOUSE}_YAXIS"
InputTrigger = "MOUSE{P1MOUSE}_LEFT_BUTTON"
InputOffscreen = "MOUSE{P1MOUSE}_RIGHT_BUTTON"
InputGunX2 = "MOUSE{P2MOUSE}_XAXIS"
InputGunY2 = "MOUSE{P2MOUSE}_YAXIS"
InputTrigger2 = "MOUSE{P2MOUSE}_LEFT_BUTTON"
InputOffscreen2 = "MOUSE{P2MOUSE}_RIGHT_BUTTON"

InputAutoTrigger = 1
InputAutoTrigger2 = 1
