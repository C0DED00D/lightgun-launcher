# RPCS3 PS Move ("gem") buttons for a Sinden gun read as a raw mouse (pair with raw_mouse.yml).
# Trigger = T, rear-left (middle) = Move, Mouse Button 4/5 (keys mapped in raw_mouse.yml) = Circle/Cross.
# "Shake" (pump = shake, used as reload by many PS Move shooters) needs an RPCS3 build that adds that binding;
# official RPCS3 ignores the line.
