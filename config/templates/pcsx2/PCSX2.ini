[UI]
SettingsVersion = 1
SetupWizardIncomplete = false
StartFullscreen = true
HideMouseCursor = true
ConfirmShutdown = false
StartPaused = false
PauseOnFocusLoss = false
HideMainWindowWhenRunning = true
RenderToSeparateWindow = false
DoubleClickTogglesFullscreen = false
InhibitScreensaver = true
SaveStateOnShutdown = false
CheckForUpdates = false

[AutoUpdater]
CheckAtStartup = false

[Folders]
Bios = bios
Snapshots = snaps
Savestates = sstates
MemoryCards = memcards
Logs = logs
Cheats = cheats
Patches = patches
Cache = cache
Textures = textures
InputProfiles = inputprofiles
Videos = videos

[Filenames]
; Your BIOS file in emulators\pcsx2\bios.
BIOS =

[EmuCore]
EnableFastBoot = true
EnableGameFixes = true
EnablePatches = true
EnableCheats = true
EnablePerGameSettings = true
EnableDiscordPresence = false
HostFs = false

[EmuCore/GS]
; Vulkan: on some GPUs Direct3D 12 (auto) was several times slower in 2-player split screen.
Renderer = 14
upscale_multiplier = 5
AspectRatio = 4:3
FMVAspectRatioSwitch = Off
deinterlace_mode = 0
VsyncEnable = true
OsdMessagesPos = 0
OsdPerformancePos = 0
OsdshowPatches = false
OsdShowSpeed = false
OsdShowFPS = false
OsdShowResolution = false
OsdShowInputs = false
OsdShowSettings = false
OsdShowIndicators = false
OsdShowFrameTimes = false
OsdShowVideoCapture = false
OsdShowInputRec = false

[MemoryCards]
Slot1_Enable = true
Slot1_Filename = Mcd001.ps2
Slot2_Enable = true
Slot2_Filename = Mcd002.ps2

[InputSources]
Keyboard = true
Mouse = true
SDL = true
XInput = false
DInput = false

[Pad1]
Type = DualShock2

[Pad2]
Type = None

; Two guns: needs a PCSX2 build that reads each mouse separately ([RawMouse] section: P1 gun = Pointer-1,
; P2 gun = Pointer-2; until a gun first reports, its pointer follows the system mouse). Official PCSX2 aims every
; GunCon 2 with the one system pointer, so with it use only USB1.
[RawMouse]
Pointer1 = {P1MOUSE_PATH}
Pointer2 = {P2MOUSE_PATH}

; GunCon 2s on USB ports 1 and 2. Sinden: trigger = left click, pump/front-left = right click
; (also what the gun sends when you shoot off screen), rear-left = middle click,
; front-right = "1" (P1) / "2" (P2), rear-right = "5" / "6".
[USB1]
Type = guncon2
guncon2_Pointer = Pointer-1
guncon2_Trigger = Pointer-1/LeftButton
guncon2_ShootOffscreen = Pointer-1/RightButton
guncon2_A = Pointer-1/RightButton
; Second binding for A, so the launcher can finish the boot-time calibration screen by itself.
guncon2_A = Keyboard/F9
guncon2_B = Pointer-1/MiddleButton
guncon2_Start = Keyboard/1
; Calibration shot: some games won't leave their setup screen without it. Rear-right on each gun.
guncon2_Recalibrate = Keyboard/5
guncon2_cursor_path =
guncon2_custom_config = false

[USB2]
Type = guncon2
guncon2_Pointer = Pointer-2
guncon2_Trigger = Pointer-2/LeftButton
; Second bindings for the trigger and A, so the launcher can finish gun 2's boot-time calibration
; (some games calibrate P2 with a normal shot, not a calibration shot).
; CenterShot ("shoot screen centre") needs a PCSX2 build that adds it; official PCSX2 ignores the line.
guncon2_Trigger = Keyboard/F6
guncon2_ShootOffscreen = Pointer-2/RightButton
guncon2_A = Pointer-2/RightButton
guncon2_A = Keyboard/F7
guncon2_B = Pointer-2/MiddleButton
guncon2_Start = Keyboard/2
guncon2_Recalibrate = Keyboard/6
guncon2_CenterShot = Keyboard/F10
guncon2_cursor_path =
guncon2_custom_config = false

[Hotkeys]
ToggleFullscreen = Keyboard/Alt & Keyboard/Return
OpenPauseMenu = Keyboard/Escape
Screenshot = Keyboard/F8


